# Build settings in this file override the ones in the Netlify dashboard.
# The build type-checks, runs Vite, then scripts/generate-pages.js, which writes
# the per-language pages, sitemap.xml and _redirects into build/.
[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  # Vite 6 and React Router 7 need Node 20+; 22 is the current LTS line.
  NODE_VERSION = "22"
